<!doctype html><html lang="ko"><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>효과음 미리듣기</title>
<style>body{background:#0b0d10;color:#e8e3d6;font-family:system-ui;margin:0;padding:20px}h1{font-size:20px}div{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}button{background:#171b21;border:1px solid #3a3226;color:inherit;padding:14px;border-radius:8px;text-align:left;cursor:pointer}button:hover,button.on{border-color:#f0a020}b{display:block;font-size:15px}span{font-size:12px;opacity:.6}</style>
<h1>ORBIT BREAKER 효과음 미리듣기 · 눌러서 재생</h1><div><button data-k="shot"><b>빔 라이플 발사</b><span>shot</span></button><button data-k="hit"><b>명중</b><span>hit</span></button><button data-k="ignite"><b>빔 사벨 점화</b><span>ignite</span></button><button data-k="heavy"><b>3타 강베기</b><span>heavy</span></button><button data-k="boom"><b>드론 폭발</b><span>boom</span></button><button data-k="destroyed"><b>정예·보스 파괴</b><span>destroyed</span></button><button data-k="chain"><b>연쇄 폭발</b><span>chain</span></button><button data-k="efire"><b>적 사격</b><span>efire</span></button><button data-k="block"><b>실드 방어</b><span>block</span></button><button data-k="dash"><b>부스트 돌진</b><span>dash</span></button><button data-k="dodge"><b>회피</b><span>dodge</span></button><button data-k="hurt"><b>피격</b><span>hurt</span></button><button data-k="specBurst"><b>필살기</b><span>specBurst</span></button><button data-k="specReady"><b>필살기 준비</b><span>specReady</span></button><button data-k="lock"><b>타겟 고정</b><span>lock</span></button><button data-k="pickup"><b>아이템</b><span>pickup</span></button><button data-k="cataCharge"><b>카타풀트 충전</b><span>cataCharge</span></button><button data-k="cataLaunch"><b>카타풀트 사출</b><span>cataLaunch</span></button><button data-k="radio"><b>무전</b><span>radio</span></button><button data-k="uiok"><b>버튼 확인</b><span>uiok</span></button><button data-k="ui"><b>버튼 이동</b><span>ui</span></button><button data-k="uiback"><b>뒤로</b><span>uiback</span></button><button data-k="deny"><b>불가</b><span>deny</span></button><button data-k="doors"><b>격납고 문</b><span>doors</span></button></div>
<script>document.querySelectorAll("button").forEach(b=>b.onclick=()=>{const a=new Audio(b.dataset.k+".mp3?v="+Date.now());a.play();b.classList.add("on");setTimeout(()=>b.classList.remove("on"),400)})</script></html>
