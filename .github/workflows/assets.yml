# asset pipeline (never deploys): push source GLBs in tools/assets/src to an assets/* branch ->
# gltf-transform (meshopt, quantize, webp, resize, simplify) + preview renders -> published to the asset-out branch
name: assets
on:
  push:
    branches: ['assets/**']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: npm ci && npm i --no-save @gltf-transform/cli@4
      - run: pip install pillow playwright && python -m playwright install --with-deps chromium
      - name: optimize
        run: |
          mkdir -p out /tmp/aout
          GT="npx gltf-transform"
          for f in tools/assets/src/*.glb; do n=$(basename $f .glb)
            case $n in *_hi) o=${n%_hi}; r=$(cat tools/assets/src/$n.ratio 2>/dev/null || echo 0.012); er=$(cat tools/assets/src/$n.error 2>/dev/null || echo 0.02); $GT optimize $f out/$o.glb --compress meshopt --simplify-ratio $r --simplify-error $er --texture-compress webp --texture-size 1024; n=$o;;
              *) $GT optimize $f out/$n.glb --compress meshopt --simplify false --texture-compress webp --texture-size 2048;; esac
            $GT inspect out/$n.glb > /tmp/aout/$n.txt; done
          ls -la out >> /tmp/aout/sizes.txt
          cp out/*.glb /tmp/aout/
      - name: previews
        run: |
          (python -m http.server 8765 >/dev/null 2>&1 &) ; sleep 2
          python tools/assets/shots.py /tmp/aout
      - name: publish
        if: always()
        run: |
          cd /tmp/aout && git init -q && git checkout -q -b asset-out && git add -A
          git -c user.name=asset-bot -c user.email=a@users.noreply.github.com commit -q -m "assets ${GITHUB_SHA::7}"
          git push -q -f https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }} asset-out
