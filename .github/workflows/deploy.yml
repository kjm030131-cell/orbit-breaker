# main 브랜치에 push하면 자동으로 빌드 → 테스트 → 배포 (대전 중계 워커 + Pages 사이트)
name: deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency: deploy
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install pillow
      - run: npm ci
      - name: build
        run: |
          python build.py
          node --check game.js
          node --test tests/*.test.mjs
          OUT=deploy python build_deploy.py
      - name: deploy pvp worker
        working-directory: deploy/pvp
        run: npx --yes wrangler@3 deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 336dcf3cc4d108f284f3b5c358959508
      - name: deploy pages
        working-directory: deploy
        run: npx --yes wrangler@3 pages deploy public --project-name orbitbreaker --branch main --commit-dirty=true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 336dcf3cc4d108f284f3b5c358959508
