<!doctype html><meta charset=utf-8><body style="margin:0;background:#1a1e26">
<script src="../../node_modules/three/build/three.min.js"></script>
<script src="../../node_modules/three/examples/js/loaders/GLTFLoader.js"></script>
<script src="../../node_modules/three/examples/js/libs/meshopt_decoder.js"></script>
<script>
// preview.html?f=out/boss.glb&yaw=0&pitch=0&hide=<bone index>  -> window.READY=true when drawn
const q=new URLSearchParams(location.search),W=512,H=512;
const R=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});R.setSize(W,H);R.outputEncoding=THREE.sRGBEncoding;document.body.appendChild(R.domElement);
const S=new THREE.Scene();S.add(new THREE.HemisphereLight(0xffffff,0x334455,1.1));const d=new THREE.DirectionalLight(0xffffff,1.4);d.position.set(2,3,4);S.add(d);
const C=new THREE.PerspectiveCamera(35,1,.001,100);
const L=new THREE.GLTFLoader();L.setMeshoptDecoder(MeshoptDecoder);
L.load(q.get("f"),g=>{const o=g.scene;S.add(o);o.updateMatrixWorld(true);
  const hide=q.get("hide");let sk=null;o.traverse(m=>{if(m.isSkinnedMesh)sk=m.skeleton});
  if(hide!==null&&sk){const b=sk.bones[+hide];b.scale.setScalar(.001);o.updateMatrixWorld(true)}
  const box=new THREE.Box3().setFromObject(o),c=box.getCenter(new THREE.Vector3()),r=box.getSize(new THREE.Vector3()).length()*.5;
  const yaw=+(q.get("yaw")||0)*Math.PI/180,pit=+(q.get("pitch")||0)*Math.PI/180,dist=r/Math.tan(17.5*Math.PI/180)*1.05;
  C.position.set(c.x+Math.sin(yaw)*Math.cos(pit)*dist,c.y+Math.sin(pit)*dist,c.z+Math.cos(yaw)*Math.cos(pit)*dist);C.lookAt(c);
  R.render(S,C);document.title=JSON.stringify({min:box.min,max:box.max,bones:sk?sk.bones.length:0});window.READY=true},undefined,e=>{document.title="ERR "+e;window.READY=true});
</script>
