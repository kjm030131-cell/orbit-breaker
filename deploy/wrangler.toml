# ARCLIGHT — Cloudflare Pages (arclight-game.pages.dev) + D1 랭킹 DB
# (옛 주소 orbitbreaker.pages.dev 는 배포 때 새 주소로 넘기는 전용 사이트로 덮어씀 — deploy/redirect)
name = "arclight-game"
pages_build_output_dir = "./public"
compatibility_date = "2026-10-27"

[[d1_databases]]
binding = "DB"
database_name = "orbit-breaker-db"
database_id = "ff24e7fc-93f1-44f0-8717-8b61ae610fbc"

# 1:1 기체 대전 실시간 중계 (pvp/ 폴더의 orbitbreaker-pvp 워커)
[[durable_objects.bindings]]
name = "PVP"
class_name = "PvpRoom"
script_name = "orbitbreaker-pvp"
